<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmo Vision - Stellarium Style</title>

    <!-- D3.js and D3-Celestial Dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/3.5.17/d3.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3-transform/0.9.3/d3-transform.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/ofrohn/d3-celestial@master/celestial.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/ofrohn/d3-celestial@master/celestial.css">

    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Real Celestial Map Container -->
    <div id="celestial-map"></div>

    <!-- Live Camera Feed Background (Active in AR Mode) -->
    <video id="ar-camera-feed" autoplay playsinline muted class="hidden"></video>

    <!-- Atmospheric Horizon Glow -->
    <div id="horizon-glow"></div>

    <!-- Dynamic Cloud Overlay Canvas -->
    <canvas id="cloud-canvas"></canvas>

    <!-- Top Interface Bar -->
    <div class="top-bar">
        <button class="top-text-btn" id="btn-ads">Remove Ads</button>
        <div class="time-readout" id="time-display">00:00</div>
        <div class="top-icons">
            <button class="icon-btn" title="Night Mode">
                <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/></svg>
            </button>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-toolbar">
        <button class="tool-btn" id="btn-search" title="Search Sky Objects">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        </button>
        <button class="tool-btn" id="btn-ar" title="Toggle AR Camera Mode">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M4 4h3l2-2h6l2 2h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2m8 3a5 5 0 0 0-5 5a5 5 0 0 0 5 5a5 5 0 0 0 5-5a5 5 0 0 0-5-5m0 2a3 3 0 0 1 3 3a3 3 0 0 1-3 3a3 3 0 0 1-3-3a3 3 0 0 1 3-3z"/></svg>
        </button>
        <button class="tool-btn active" id="btn-clouds" title="Toggle Clouds On/Off">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/></svg>
        </button>
        <button class="tool-btn" id="btn-menu" title="Menu Settings">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
        </button>
    </div>

    <!-- Application Script -->
    <script src="app.js"></script>
</body>
</html>
