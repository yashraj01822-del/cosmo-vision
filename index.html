<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

  <title>Cosmo Vision</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main id="app">

    <!-- SKY -->
    <canvas id="sky"></canvas>

    <!-- CAMERA -->
    <video id="camera" autoplay playsinline></video>

    <!-- TOP BAR -->
    <header class="topbar">

      <div class="brand">
        <div class="logo">✦</div>

        <div>
          <h1>Cosmo Vision</h1>
          <p>What clouds hide, we show.</p>
        </div>
      </div>

      <div class="top-buttons">
        <button id="searchButton">⌕</button>
        <button id="cameraButton">◉</button>
        <button id="settingsButton">⚙</button>
      </div>

    </header>


    <!-- SEARCH -->
    <section id="searchPanel" class="panel hidden">

      <input
        id="searchInput"
        type="search"
        placeholder="Search stars, planets, Messier objects..."
        autocomplete="off">

      <div id="searchResults"></div>

    </section>


    <!-- OBJECT INFO -->
    <section id="objectInfo" class="info-card hidden">

      <button id="closeInfo">×</button>

      <div class="object-icon">✦</div>

      <h2 id="objectName">Object</h2>

      <p id="objectType">Celestial object</p>

      <div class="coordinates">

        <div>
          <span>RA</span>
          <strong id="objectRA">--</strong>
        </div>

        <div>
          <span>DEC</span>
          <strong id="objectDEC">--</strong>
        </div>

      </div>

    </section>


    <!-- BOTTOM CONTROL PANEL -->
    <section class="bottom-panel">

      <div class="status-row">

        <span id="orientationStatus">
          📱 Manual mode
        </span>

        <span id="objectCount">
          0 objects
        </span>

      </div>


      <div class="timeline">

        <button id="timeBack">−</button>

        <input
          id="timeSlider"
          type="range"
          min="-12"
          max="12"
          value="0"
          step="1">

        <button id="timeForward">+</button>

      </div>


      <div class="controls">

        <button id="orientationButton">
          📱 Motion
        </button>

        <button id="resetButton">
          ⟳ Reset
        </button>

        <button id="cloudButton">
          ☁ Clouds
        </button>

      </div>

    </section>


    <!-- SETTINGS -->
    <aside id="settingsPanel" class="settings hidden">

      <div class="settings-header">

        <h2>Cosmo Vision</h2>

        <button id="closeSettings">×</button>

      </div>

      <label>
        <input type="checkbox" id="labelsToggle" checked>
        Show object labels
      </label>

      <label>
        <input type="checkbox" id="starsToggle" checked>
        Show stars
      </label>

      <label>
        <input type="checkbox" id="cloudToggle">
        Cloud overlay
      </label>

      <label>
        <input type="checkbox" id="motionToggle">
        Phone motion
      </label>

      <div class="settings-info">

        <p>Cosmo Vision</p>
        <small>
          What clouds hide, we show.
        </small>

      </div>

    </aside>

  </main>

  <script src="objects.js"></script>
  <script src="app.js"></script>

</body>
</html>
