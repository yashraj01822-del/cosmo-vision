<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

    <title>Cosmo Vision</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- TOP BAR -->
<header class="topbar">

    <div class="brand">
        <div class="logo">✦</div>

        <div>
            <h1>Cosmo Vision</h1>
            <p>What clouds hide, we show.</p>
        </div>
    </div>

    <div class="top-actions">
        <button id="locationBtn" title="Location">📍</button>
        <button id="settingsBtn" title="Settings">⚙️</button>
    </div>

</header>


<!-- SEARCH -->
<div class="search-box">

    <span>🔍</span>

    <input
        id="searchInput"
        type="text"
        placeholder="Search stars, planets, nebulae..."
    >

    <button id="searchBtn">Search</button>

</div>


<!-- OBJECT SEARCH RESULTS -->
<div id="searchResults" class="search-results"></div>


<!-- MAIN SKY -->
<main>

    <section class="sky-container">

        <canvas id="skyCanvas"></canvas>

        <div class="direction north">N</div>
        <div class="direction east">E</div>
        <div class="direction south">S</div>
        <div class="direction west">W</div>


        <!-- SKY INFORMATION -->
        <div class="sky-info">

            <div class="score">
                <span>Sky Clarity</span>
                <strong id="clarity">8.7</strong>
                <small>/10</small>
            </div>

            <div class="weather">
                <span>☁ Cloud Cover</span>
                <strong id="cloudPercent">24%</strong>
            </div>

        </div>


        <!-- OBJECT INFO -->
        <div id="objectInfo" class="object-info hidden">

            <button id="closeObject">×</button>

            <span id="objectType">STAR</span>

            <h2 id="objectName">Sirius</h2>

            <p id="objectDescription">
                The brightest star in Earth's night sky.
            </p>

            <div class="object-data">
                <span>RA <b id="objectRA">06h 45m</b></span>
                <span>DEC <b id="objectDEC">−16° 43′</b></span>
            </div>

        </div>

    </section>


    <!-- CONTROLS -->
    <section class="controls">

        <button id="arBtn">
            📷
            <span>AR Sky</span>
        </button>

        <button id="cloudBtn">
            ☁️
            <span>Clouds</span>
        </button>

        <button id="telescopeBtn">
            🔭
            <span>Telescope</span>
        </button>

        <button id="objectsBtn">
            ⭐
            <span>Objects</span>
        </button>

    </section>


    <!-- TIMELINE -->
    <section class="timeline">

        <div class="timeline-header">

            <span>Sky Time</span>

            <strong id="timeDisplay">
                Tonight 20:00
            </strong>

        </div>

        <input
            id="timeSlider"
            type="range"
            min="-12"
            max="12"
            value="0"
        >

        <div class="timeline-labels">
            <span>Now</span>
            <span>+6h</span>
            <span>+12h</span>
        </div>

    </section>

</main>


<!-- BOTTOM NAV -->
<nav class="bottom-nav">

    <button class="active">
        🌌
        <span>Sky</span>
    </button>

    <button id="discoverBtn">
        ✨
        <span>Discover</span>
    </button>

    <button id="arNavBtn">
        📷
        <span>AR</span>
    </button>

    <button id="settingsNavBtn">
        ⚙️
        <span>Settings</span>
    </button>

</nav>


<!-- SETTINGS PANEL -->
<div id="settingsPanel" class="panel">

    <div class="panel-header">

        <h2>Settings</h2>

        <button id="closeSettings">×</button>

    </div>


    <label>
        <span>☁ Cloud Overlay</span>
        <input type="checkbox" id="cloudToggle" checked>
    </label>


    <label>
        <span>⭐ Star Labels</span>
        <input type="checkbox" id="starToggle" checked>
    </label>


    <label>
        <span>🌙 Night Vision</span>
        <input type="checkbox" id="nightToggle" checked>
    </label>


    <label>
        <span>🧭 Device Orientation</span>
        <input type="checkbox" id="orientationToggle">
    </label>


    <button class="setting-button" id="cameraPermission">
        📷 Enable Camera
    </button>


    <button class="setting-button" id="locationPermission">
        📍 Use My Location
    </button>

</div>


<!-- AR CAMERA -->
<div id="cameraScreen" class="camera-screen">

    <video id="camera" autoplay playsinline></video>

    <canvas id="arCanvas"></canvas>

    <div class="ar-title">
        <b>Cosmo Vision AR</b>
        <span>Point your phone at the sky</span>
    </div>

    <button id="closeCamera" class="close-camera">
        ×
    </button>

</div>


<script src="app.js"></script>

</body>
</html>
