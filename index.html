<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmo Vision - Stellarium Edition</title>

    <!-- D3.js and D3-Celestial Dependencies for Real Space Data -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/3.5.17/d3.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3-transform/0.9.3/d3-transform.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/ofrohn/d3-celestial@master/celestial.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/ofrohn/d3-celestial@master/celestial.css">

    <!-- Google Fonts & Custom CSS -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Real Celestial Map Container -->
    <div id="celestial-map"></div>

    <!-- Atmospheric & Horizon Glow -->
    <div id="horizon-glow"></div>

    <!-- Dynamic Cloud Layer -->
    <canvas id="cloud-canvas"></canvas>

    <!-- Top Info Bar -->
    <div class="top-bar">
        <div class="brand">COSMO VISION</div>
        <div class="location-time">
            <span id="location-display">Earth (Equatorial View)</span> | 
            <span id="time-display">2026-08-08 19:39:35 UTC</span>
            <span id="speed-multiplier-display" class="speed-badge">1x</span>
        </div>
    </div>

    <!-- Date/Time Selector Modal Panel -->
    <div class="time-panel hidden" id="time-panel">
        <h3>Date & Time Settings</h3>
        <div class="control-group">
            <label for="datetime-picker">Select Date and Time</label>
            <input type="datetime-local" id="datetime-picker">
        </div>
        <div class="time-panel-buttons">
            <button id="btn-apply-time">Apply Time</button>
            <button id="btn-now-time">Jump to Now</button>
        </div>
    </div>

    <!-- Cloud Control Popup Menu -->
    <div class="cloud-panel hidden" id="cloud-panel">
        <h3>Cloud Overlay Settings</h3>
        <div class="control-group">
            <label for="cloud-opacity">Cloud Coverage Density</label>
            <input type="range" id="cloud-opacity" min="0" max="1" step="0.05" value="0.5">
        </div>
        <div class="control-group">
            <label for="cloud-speed">Wind Velocity</label>
            <input type="range" id="cloud-speed" min="0" max="0.005" step="0.0005" value="0.001">
        </div>
    </div>

    <!-- Bottom Tool Bar (Stellarium Style) -->
    <div class="bottom-toolbar">
        <!-- Display Toggles -->
        <button class="tool-btn active" id="btn-constellations" title="Toggle Constellation Lines">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2L9 9l-7 3 7 3 3 7 3-7 7-3-7-3z"/></svg>
            <span>Lines</span>
        </button>
        <button class="tool-btn active" id="btn-names" title="Toggle Star/Constellation Names">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M5 4v3h5v12h3V7h5V4H5z"/></svg>
            <span>Labels</span>
        </button>
        <button class="tool-btn active" id="btn-grid" title="Toggle Coordinate Grid">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M20 2H4c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM8 20H4v-4h4v4zm0-6H4v-4h4v4zm0-6H4V4h4v4zm6 12h-4v-4h4v4zm0-6h-4v-4h4v4zm0-6h-4V4h4v4zm6 12h-4v-4h4v4zm0-6h-4v-4h4v4zm0-6h-4V4h4v4z"/></svg>
            <span>Grid</span>
        </button>
        <button class="tool-btn active" id="btn-clouds" title="Toggle Cloud Layer">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/></svg>
            <span>Clouds</span>
        </button>

        <div class="divider"></div>

        <!-- Stellarium Time Control Buttons -->
        <button class="tool-btn" id="btn-rewind" title="Rewind Time (Faster)">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/></svg>
            <span>Rewind</span>
        </button>
        <button class="tool-btn active" id="btn-play-pause" title="Pause / Resume Real Time Flow">
            <svg id="icon-pause" viewBox="0 0 24 24"><path fill="currentColor" d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            <svg id="icon-play" class="hidden" viewBox="0 0 24 24"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
            <span>Pause</span>
        </button>
        <button class="tool-btn" id="btn-realtime" title="Reset to Current Real Time">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>
            <span>Real Time</span>
        </button>
        <button class="tool-btn" id="btn-ffwd" title="Fast Forward Time">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg>
            <span>FFwd</span>
        </button>
        <button class="tool-btn" id="btn-time-dialog" title="Open Date & Time Dialog">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/></svg>
            <span>Date/Time</span>
        </button>
    </div>

    <!-- Application Logic -->
    <script src="app.js"></script>
</body>
</html>
